<!DOCTYPE html>
<html>
<head>
    <title>Skills / Angelus Palata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body{
            background-color:#e6f7ff;
            text-align:center;
            font-family:"Times New Roman", sans-serif;
            margin:0;
        }

        nav{
            padding:20px 60px;
            display:flex;
            align-items:center;
            margin:auto;
        }

        nav h3{
            font-size:26px;
            color:#222;
            margin:0;
        }

        nav div{
            display:flex;
            justify-content:center;
            flex:1;
        }

        nav a{
            margin:15px;
            text-decoration:none;
            color:#222;
        }

        nav a:hover{
            color:#007BFF;
        }

        nav a.active{
            color:#007BFF;
            font-weight:bold;
        }

        .card{
            background:white;
            width:80%;
            max-width:900px;
            margin:40px auto;
            padding:60px;
            border-radius:15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .skills-container{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:30px;
            flex-wrap:wrap;
        }

        .skill-card{
            background:#f8f9fa;
            padding:20px;
            border-radius:10px;
            width:200px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .skill-card:hover{
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.12);
        }
        @media (max-width:768px){
    nav{
        padding:15px 10px;
        flex-direction:column;
    }
    nav div{
        flex-wrap:wrap;
        justify-content:center;
    }
    .card{
        padding:25px;
        width:90%;
    }
}
    </style>
</head>
<body>
    <nav>
        <h3>Angelus Palata</h3>
        <div>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="skills.html" class="active">Skills</a>
            <a href="contact.html"> Contact</a>
        </div>
    </nav>

    <div class="card">
        <h1>My Skills</h1>
        <p>Technologies and tools I use to build projects.</p>

        <div class="skills-container">
            <div class="skill-card">
                <i class="fa-brands fa-html5" style="font-size:40px; color:#e34c26;"></i>
                <h3>HTML</h3>
                <p>Building the structure of web pages.</p>
            </div>

            <div class="skill-card">
                <i class="fa-brands fa-css3-alt" style="font-size:40px; color:#264de4;"></i>
                <h3>CSS</h3>
                <p>Designing responsive and modern websites.</p>
            </div>

            <div class="skill-card">
                <i class="fa-brands fa-js" style="font-size:40px; color:#f0db4f;"></i>
                <h3>JavaScript</h3>
                <p>Learning to make websites interactive.</p>
            </div>
        </div>
    </div>
    <script src="script.js"> </script>

</html>
